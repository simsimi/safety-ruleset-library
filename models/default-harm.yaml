# 위해 판독기 연결 설정 — 진성/비진성 판별 모델 (KcELECTRA-base)
#
# 모델 출력은 2클래스 확률이다. 인덱스 의미 (모델 config에 id2label이 없어
# 이 설정이 기준이다):
#   0 = non_genuine (비진성)
#   1 = genuine (진성 위해)
# 위해 확률은 인덱스 1을 [0, 1] 그룹 softmax로 읽은 값이며, 별도 보정
# (temperature 등)은 적용하지 않는다.
#
# 결합 정책: 사전이 잡은 건은 위해 확률 0.5 이상일 때 확정하고,
# 사전이 놓친 건은 0.4 이상이면 단독으로 올린다.
# 학습 시 입력 절단이 96 토큰이라 추론도 max_length 96으로 맞춘다.
adapter: local
local:
  format: hf
  path: models/harm-genuine-v2
  max_length: 96
  harm_output:
    from: 1
    activation: softmax
    group: [0, 1]
policy:
  confirm: 0.5
  standalone: 0.4
version: genuine-v2
